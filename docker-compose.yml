services:
  singbox-ui:
    image: ghcr.io/spadesa99/singbox_ui:latest
    container_name: singbox-ui
    restart: unless-stopped
    # 网关模式需要与宿主共享 netns，才能用 nft / ip rule 直接接管宿主流量
    network_mode: host
    # nft、ip rule、ip route 需要网络管理能力
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/home/data
    environment:
      - DATA_DIR=/home/data
      - HOST_DATA_DIR=${PWD}/data
      - LISTEN_ADDR=127.0.0.1:7000
      # docker：sing-box 实例以容器方式运行；local：以宿主机进程方式运行
      - SANDBOX_RUNTIME=docker
      - TZ=Asia/Shanghai
